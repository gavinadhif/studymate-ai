<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyMate AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>StudyMate AI</h1>
    <p class="subtitle">Asisten belajar berbasis AI</p>

    <div class="card">
      <textarea
        id="question"
        placeholder="Masukkan pertanyaan atau materi yang ingin kamu pelajari..."
      ></textarea>

      <button id="askButton">Tanya AI</button>

      <div id="loading" class="loading hidden">
        AI sedang berpikir...
      </div>

      <div id="answer" class="answer"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
