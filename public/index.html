<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyMate AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-icon">S</div>
        <div>
          <h1>StudyMate AI</h1>
          <p class="subtitle">Asisten belajar berbasis AI</p>
        </div>
      </div>
      <button id="clearButton" class="clear-btn" title="Mulai percakapan baru">Percakapan Baru</button>
    </header>

    <main id="chat" class="chat">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">💬</div>
        <p>Tanyakan apa saja tentang materi yang ingin kamu pelajari</p>
      </div>
    </main>

    <div class="composer">
      <div class="composer-inner">
        <textarea
          id="question"
          placeholder="Tulis pertanyaan kamu di sini..."
          rows="1"
        ></textarea>
        <button id="askButton" aria-label="Kirim">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <p class="hint">Enter untuk kirim &middot; Shift+Enter untuk baris baru</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
